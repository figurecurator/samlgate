name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Windows here; Apple Silicon macOS in build-macos (published for the Homebrew tap). Linux is not published yet.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish (NativeAOT)
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          dotnet publish src/Samlgate/Samlgate.csproj -c Release -r ${{ matrix.rid }} -o out `
            -p:Version=$version -p:DebugType=none
          Copy-Item LICENSE, README.md out/

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path out/samlgate.exe, out/LICENSE, out/README.md `
            -DestinationPath "dist/samlgate-$($env:GITHUB_REF_NAME)-${{ matrix.rid }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*

  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish (NativeAOT + WebView helper)
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/Samlgate/Samlgate.csproj -c Release -r osx-arm64 -o out \
            -p:Version="$version" -p:DebugType=none
          ./out/samlgate --version
          test -x ./out/samlgate-webview
          cp LICENSE README.md out/

      - name: Package
        run: |
          mkdir dist
          tar -czf "dist/samlgate-${GITHUB_REF_NAME}-osx-arm64.tar.gz" -C out \
            samlgate samlgate-webview LICENSE README.md

      - uses: actions/upload-artifact@v4
        with:
          name: osx-arm64
          path: dist/*

  release:
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
