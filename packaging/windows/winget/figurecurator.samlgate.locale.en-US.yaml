ShortDescription: AWS credentials from a browser-based SAML sign-in.
Description: |-
  A browser-based alternative to saml2aws login using a dedicated persistent Chromium profile.
  Reads compatible account settings from ~/.saml2aws and supports credential_process and exec.
  Uses an installed Chromium browser without downloading Playwright or browser drivers.
